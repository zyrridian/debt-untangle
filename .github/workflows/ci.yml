name: Release and Update Store

on:
  push:
    tags:
      - "v*"
    branches:
      - main
      - master
    paths:
      - "store/**"
      - "app.json"
      - "app.config.js"
      - "app.config.ts"
      - "assets/**"

  workflow_dispatch:

permissions:
  contents: write

env:
  APP_ID: debt-untangle
  APP_NAME: Debt Untangle
  APP_DESCRIPTION: Keep track of shared expenses and debts.
  APP_CATEGORY: Finance
  APP_REPOSITORY: https://github.com/zyrridian/debt-untangle

jobs:
  release:
    name: Build, Release and Update Store
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: "17"

      - name: Run Expo prebuild
        run: npx expo prebuild --platform android --clean

      - name: Decode Android keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail

          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "ANDROID_KEYSTORE_BASE64 secret is not set"
            exit 1
          fi

          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode \
            > android/app/release.keystore

      - name: Build Android release APK
        env:
          MYAPP_UPLOAD_STORE_FILE: release.keystore
          MYAPP_UPLOAD_STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          MYAPP_UPLOAD_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          MYAPP_UPLOAD_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail

          cd android
          ./gradlew assembleRelease

      - name: Find generated Android launcher icon
        id: icon
        run: |
          set -euo pipefail

          ICON=""

          for candidate in \
            android/app/src/main/res/mipmap-xxxhdpi/ic_launcher.webp \
            android/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png \
            android/app/src/main/res/mipmap-xxhdpi/ic_launcher.webp \
            android/app/src/main/res/mipmap-xxhdpi/ic_launcher.png \
            android/app/src/main/res/mipmap-xxxhdpi/ic_launcher_foreground.webp \
            android/app/src/main/res/mipmap-xxxhdpi/ic_launcher_foreground.png
          do
            if [ -f "$candidate" ]; then
              ICON="$candidate"
              break
            fi
          done

          if [ -z "$ICON" ]; then
            echo "Generated Android launcher icon was not found"
            find android/app/src/main/res \
              -type f \
              \( -iname '*launcher*' -o -iname '*icon*' \) \
              -print
            exit 1
          fi

          echo "Using launcher icon: $ICON"
          echo "path=$ICON" >> "$GITHUB_OUTPUT"

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: android/app/build/outputs/apk/release/app-release.apk
          tag_name: ${{ github.ref_name }}
          name: Debt Untangle ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Checkout public app registry
        uses: actions/checkout@v4
        with:
          repository: zyrridian/apps
          token: ${{ secrets.STORE_PAT }}
          path: storefront-repo

      - name: Copy release files and create manifest
        working-directory: storefront-repo
        env:
          VERSION: ${{ github.ref_name }}
          RELEASE_URL: https://github.com/zyrridian/debt-untangle/releases/tag/${{ github.ref_name }}
          ICON_SOURCE: ${{ github.workspace }}/${{ steps.icon.outputs.path }}
        run: |
          set -euo pipefail

          VERSION="${VERSION#v}"

          mkdir -p "apps/$APP_ID/screenshots"

          cp "${{ github.workspace }}/android/app/build/outputs/apk/release/app-release.apk" \
            "apps/$APP_ID/app-release.apk"

          cp "$ICON_SOURCE" \
            "apps/$APP_ID/icon.webp"

          if compgen -G "${{ github.workspace }}/store/screenshots/*" > /dev/null; then
            cp "${{ github.workspace }}"/store/screenshots/* \
              "apps/$APP_ID/screenshots/"
          fi

          SCREENSHOTS="$(
            find "apps/$APP_ID/screenshots" \
              -maxdepth 1 \
              -type f \
              -printf '%f\n' |
              sort |
              jq -R -s '
                split("\n")
                | map(select(length > 0))
              '
          )"

          jq -n \
            --arg schema "v1" \
            --arg id "$APP_ID" \
            --arg name "$APP_NAME" \
            --arg version "$VERSION" \
            --arg description "$APP_DESCRIPTION" \
            --arg category "$APP_CATEGORY" \
            --arg repository "$APP_REPOSITORY" \
            --arg release "$RELEASE_URL" \
            --arg icon "icon.webp" \
            --arg artifact "app-release.apk" \
            --argjson screenshots "$SCREENSHOTS" \
            '{
              schema: $schema,
              id: $id,
              name: $name,
              version: $version,
              description: $description,
              category: $category,
              repository: $repository,
              release: $release,
              featured: false,
              icon: $icon,
              artifacts: [
                {
                  platform: "android",
                  type: "apk",
                  filename: $artifact
                }
              ],
              screenshots: $screenshots
            }' > "apps/$APP_ID/manifest.json"

      - name: Generate normalized registry
        working-directory: storefront-repo
        env:
          REGISTRY_GENERATED_AT: ${{ github.event.head_commit.timestamp }}
        run: |
          set -euo pipefail

          REGISTRY_GENERATED_AT="${REGISTRY_GENERATED_AT:-$(date -u +%Y-%m-%dT%H:%M:%SZ)}" \
            node scripts/generate-registry.mjs

      - name: Verify registry entry
        working-directory: storefront-repo
        run: |
          set -euo pipefail

          test -f "apps/$APP_ID/app-release.apk"
          test -f "apps/$APP_ID/icon.webp"
          test -f "apps/$APP_ID/manifest.json"
          test -f registry/apps.json

          jq -e \
            --arg id "$APP_ID" \
            '.apps[] | select(.id == $id)' \
            registry/apps.json > /dev/null

          jq -e \
            --arg id "$APP_ID" \
            '.apps[]
             | select(.id == $id)
             | .artifacts[]
             | select(.filename == "app-release.apk")
             | (.sha256 | test("^[a-f0-9]{64}$"))' \
            registry/apps.json > /dev/null

      - name: Commit and push registry update
        working-directory: storefront-repo
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add \
            "apps/$APP_ID" \
            registry/apps.json

          if git diff --cached --quiet; then
            echo "No registry changes to commit"
            exit 0
          fi

          git commit -m "Auto-release: Debt Untangle ${{ github.ref_name }}"
          git push

  update-metadata:
    name: Update Store Metadata
    if: |
      (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master') &&
      (contains(github.event.head_commit.message, '[skip store]') == false)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run Expo prebuild
        run: |
          npm ci
          npx expo prebuild --platform android --clean

      - name: Find generated Android launcher icon
        id: icon
        run: |
          set -euo pipefail

          ICON=""

          for candidate in \
            android/app/src/main/res/mipmap-xxxhdpi/ic_launcher.webp \
            android/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png \
            android/app/src/main/res/mipmap-xxhdpi/ic_launcher.webp \
            android/app/src/main/res/mipmap-xxhdpi/ic_launcher.png
          do
            if [ -f "$candidate" ]; then
              ICON="$candidate"
              break
            fi
          done

          if [ -z "$ICON" ]; then
            echo "Generated Android launcher icon was not found"
            exit 1
          fi

          echo "path=$ICON" >> "$GITHUB_OUTPUT"

      - name: Checkout public app registry
        uses: actions/checkout@v4
        with:
          repository: zyrridian/apps
          token: ${{ secrets.STORE_PAT }}
          path: storefront-repo

      - name: Copy metadata and icon
        working-directory: storefront-repo
        env:
          ICON_SOURCE: ${{ github.workspace }}/${{ steps.icon.outputs.path }}
        run: |
          set -euo pipefail

          mkdir -p "apps/$APP_ID/screenshots"

          cp "$ICON_SOURCE" \
            "apps/$APP_ID/icon.webp"

          if compgen -G "${{ github.workspace }}/store/screenshots/*" > /dev/null; then
            cp "${{ github.workspace }}"/store/screenshots/* \
              "apps/$APP_ID/screenshots/"
          fi

          VERSION="$(
            jq -r --arg id "$APP_ID" \
              '.apps[] | select(.id == $id) | .version' \
              registry/apps.json
          )"

          RELEASE_URL="$(
            jq -r --arg id "$APP_ID" \
              '.apps[] | select(.id == $id) | .release' \
              registry/apps.json
          )"

          SCREENSHOTS="$(
            find "apps/$APP_ID/screenshots" \
              -maxdepth 1 \
              -type f \
              -printf '%f\n' |
              sort |
              jq -R -s '
                split("\n")
                | map(select(length > 0))
              '
          )"

          jq -n \
            --arg schema "v1" \
            --arg id "$APP_ID" \
            --arg name "$APP_NAME" \
            --arg version "$VERSION" \
            --arg description "$APP_DESCRIPTION" \
            --arg category "$APP_CATEGORY" \
            --arg repository "$APP_REPOSITORY" \
            --arg release "$RELEASE_URL" \
            --arg icon "icon.webp" \
            --arg artifact "app-release.apk" \
            --argjson screenshots "$SCREENSHOTS" \
            '{
              schema: $schema,
              id: $id,
              name: $name,
              version: $version,
              description: $description,
              category: $category,
              repository: $repository,
              release: $release,
              featured: false,
              icon: $icon,
              artifacts: [
                {
                  platform: "android",
                  type: "apk",
                  filename: $artifact
                }
              ],
              screenshots: $screenshots
            }' > "apps/$APP_ID/manifest.json"

      - name: Generate normalized registry
        working-directory: storefront-repo
        run: |
          set -euo pipefail
          node scripts/generate-registry.mjs

      - name: Commit and push metadata update
        working-directory: storefront-repo
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add \
            "apps/$APP_ID" \
            registry/apps.json

          if git diff --cached --quiet; then
            echo "No metadata changes to commit"
            exit 0
          fi

          git commit -m "Auto-update: Debt Untangle metadata"
          git push
